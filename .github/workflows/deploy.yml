name: Build and Deploy to FTP

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          PUBLIC_RECAPTCHA_SITE_KEY: ${{ secrets.RECAPTCHA_SITE_KEY }}

      - name: Inject secrets into config files
        run: |
          sed -i 's|__RECAPTCHA_API_KEY__|${{ secrets.RECAPTCHA_API_KEY }}|g' php/config.php
          sed -i 's|__RECAPTCHA_SITE_KEY__|${{ secrets.RECAPTCHA_SITE_KEY }}|g' php/config.php
          sed -i 's|__RECAPTCHA_PROJECT_ID__|${{ secrets.RECAPTCHA_PROJECT_ID }}|g' php/config.php

      - name: Assemble staging directory
        run: |
          mkdir -p _staging/php
          shopt -s dotglob
          cp -r dist/* _staging/
          cp -r php/* _staging/php/

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: _staging/
          server-dir: ${{ secrets.FTP_TARGET_DIR }}

      - name: Purge Cloudflare cache
        env:
          CLOUDFLARE_ZONE_ID: f1f41a54923e1ec1c62276e515c393ed
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN is empty; skipping Cloudflare cache purge"
            exit 0
          fi
          response=$(curl --fail-with-body --silent --show-error --request POST \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{"purge_everything":true}' \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache") || {
            printf '%s\n' "$response"
            exit 1
          }
          if ! printf '%s\n' "$response" | jq -e '.success == true' >/dev/null; then
            echo "::error::Cloudflare cache purge returned success=false"
            printf '%s\n' "$response"
            exit 1
          fi
          echo "Cloudflare cache purged"
